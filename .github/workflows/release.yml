name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (for example v0.1.0)
        required: true
        type: string
  push:
    tags: ['v*']
    branches: [main]
    paths: [RELEASE_VERSION, .github/workflows/release.yml]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    # glibc 2.35 baseline; no CPU-specific RUSTFLAGS.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$INPUT_TAG"
          else
            tag="$(cat RELEASE_VERSION)"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
          existing="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          tagged_commit="$(printf '%s\n' "$existing" | awk '/\^\{\}$/ { peeled=$1 } NR==1 { direct=$1 } END { print peeled ? peeled : direct }')"
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$GITHUB_SHA" ]]; then
            echo 'Release tag points at different source; choose a new version.'
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          targets: x86_64-unknown-linux-gnu
      - name: Validate release versions
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > metadata.json
          python3 - <<'PY'
          import json, os
          versions = {p['name']: p['version'] for p in json.load(open('metadata.json'))['packages']}
          for package in ('fo-cli', 'fo-corpus'):
              if 'v' + versions[package] != os.environ['TAG']:
                  raise SystemExit(f'{package} version does not match the requested release tag')
          PY
      - name: Test search, acquisition, and conformance
        run: cargo test --locked -p fo-core -p fo-cli -p fo-corpus -p fo-conformance
      - name: Test optional spectral backend
        run: cargo test --locked -p fo-core --features frankenscipy
      - name: Build CLI distribution
        run: cargo build --locked --release --target "$TARGET" -p fo-cli -p fo-corpus --bins
      - name: Package deterministic archive and verify extracted executables
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p package/bin dist extracted
          # Include every CLI from the two user-facing packages, including
          # fo, fo-corpus, fo-section, and the SEC-specific commands.
          for binary in target/"$TARGET"/release/fo target/"$TARGET"/release/fo-*; do
            [[ -f "$binary" && -x "$binary" ]] || continue
            file "$binary" | grep -q 'ELF 64-bit.*x86-64'
            install -m 755 "$binary" package/bin/
          done
          test -x package/bin/fo
          test -x package/bin/fo-corpus
          test -x package/bin/fo-section
          install -m 644 LICENSE README.md Cargo.lock package/
          {
            echo "tag=$TAG"
            echo "commit=$GITHUB_SHA"
            echo "target=$TARGET"
            echo 'minimum_glibc=2.35'
            echo 'features=default'
            rustc -Vv
            cargo --version
            sha256sum Cargo.lock
          } > package/BUILD_INFO
          chmod 755 package package/bin
          chmod 644 package/BUILD_INFO
          archive="franken-overlap-$TARGET.tar.xz"
          epoch="$(git show -s --format=%ct HEAD)"
          package_archive() {
            tar --format=gnu --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
              -cJf "$1" -C package .
          }
          package_archive "dist/$archive"
          package_archive "$RUNNER_TEMP/repacked.tar.xz"
          cmp "dist/$archive" "$RUNNER_TEMP/repacked.tar.xz"
          (cd dist; sha256sum "$archive" > "$archive.sha256"; cp "$archive.sha256" SHA256SUMS; sha256sum -c SHA256SUMS)
          tar -xJf "dist/$archive" -C extracted
          for binary in extracted/bin/*; do "$binary" --help > /dev/null; done
          extracted/bin/fo --version
          extracted/bin/fo-corpus --version
          extracted/bin/fo-corpus list
          extracted/bin/fo-corpus sec10k --help
          extracted/bin/fo index fixtures/corpus --output smoke.foidx
          extracted/bin/fo query smoke.foidx fixtures/specimens/edited.txt --json > smoke.json
          python3 - <<'PY'
          import json
          hits = json.load(open('smoke.json'))
          assert hits, 'Edited-passage search returned no provenance results'
          assert any(hit['path'].endswith('source.txt') for hit in hits), hits
          PY
          # This test uses an unrelated working directory, generated data and
          # the extracted binaries only; it cannot accidentally test cargo-run.
          python3 ci/release-smoke.py extracted/bin "${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist
      - name: Verify transferred checksums
        run: cd dist && sha256sum -c SHA256SUMS && sha256sum -c *.sha256
      - name: Publish official release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Linux x86_64 binaries for passage provenance search and corpus acquisition.
            Requires glibc 2.35 or newer. The archive contains bin/fo, bin/fo-corpus,
            and the other search and SEC utilities. No Rust installation is needed.

            Download the tar.xz and SHA256SUMS, run `sha256sum -c SHA256SUMS`,
            extract the archive, and copy bin/* to a directory on your PATH.
            SEC acquisition requires your own SEC_USER_AGENT identity and network access.

            Cargo.lock and BUILD_INFO identify the source, locked dependencies,
            toolchain and features. Repeatable archive packaging is tested;
            bit-identical compiler output on different build machines is not claimed.
      - name: Download and execute published asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir downloaded installed
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded
          cmp dist/SHA256SUMS downloaded/SHA256SUMS
          (cd downloaded; sha256sum -c SHA256SUMS; sha256sum -c *.sha256)
          tar -xJf "downloaded/franken-overlap-$TARGET.tar.xz" -C installed
          for binary in installed/bin/*; do
            file "$binary" | grep -q 'ELF 64-bit.*x86-64'
            "$binary" --help > /dev/null
          done
          installed/bin/fo --version
          installed/bin/fo-corpus --version
          installed/bin/fo-corpus sec10k --help
