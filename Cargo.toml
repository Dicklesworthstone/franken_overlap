[workspace]
resolver = "2"
members = [
  "crates/fo-core",
  "crates/fo-cli",
  "crates/fo-conformance",
  "crates/fo-bench",
  "crates/fo-corpus",
  "crates/franken-overlap",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license-file = "LICENSE"
authors = ["Jeffrey Emanuel <jeff141421@gmail.com>"]
repository = "https://github.com/Dicklesworthstone/franken_overlap"
homepage = "https://github.com/Dicklesworthstone/franken_overlap"
readme = "README.md"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.4.0"
flate2 = "1.1.9"
html2text = "0.17.1"
rayon = "1.12.0"
reqwest = { version = "0.13.4", features = ["blocking", "brotli", "deflate", "gzip", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
fo-core = { path = "crates/fo-core" }
fo-corpus = { path = "crates/fo-corpus" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-perf]
inherits = "release"
debug = "line-tables-only"
strip = false
